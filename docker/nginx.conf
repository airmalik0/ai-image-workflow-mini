# Раздача собранного фронтенда и прокси на API.
#
# Фронт и бэкенд стоят за одним хостом сознательно: базовый адрес API в бандле —
# относительный `/api` (VITE_* вшивается на сборке и рантаймом не меняется),
# поэтому проксирование здесь заменяет собой и переменную окружения, и CORS.

# Апгрейд протокола для WebSocket-транспорта событий (`/api/ws`).
# Пустой `Connection` вместо `upgrade` обязателен: иначе обычные запросы
# уезжают наверх с заголовком апгрейда и Fastify отвечает на них 400.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS docker'а с коротким TTL: имя `api` резолвится на каждый запрос.
    # Со статическим `proxy_pass http://api:3000` nginx запоминает адрес один раз
    # при старте и после пересоздания контейнера API отдаёт 502 до перезапуска.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api {
        set $upstream http://api:3000;
        proxy_pass $upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE. Без этих четырёх строк поток статусов копится в буфере nginx и
        # приезжает пачкой в конце запуска — то есть realtime исчезает, а выглядит
        # это как «просто медленно». API дополнительно шлёт `X-Accel-Buffering: no`,
        # но полагаться на один только заголовок нельзя: он не отключает
        # буферизацию ответа целиком у старых конфигураций.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # поток живёт столько же, сколько запуск графа; пульс идёт раз в 15 с,
        # но час запаса дешевле, чем оборванный на середине таймлайн
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # загрузка референсов — multipart; лимит совпадает с MAX_UPLOAD_BYTES
        client_max_body_size 16m;
    }

    # SPA: любой неизвестный путь отдаёт index.html, маршрутизация — на клиенте
    location / {
        try_files $uri $uri/ /index.html;
    }

    # хэш в имени файла делает содержимое неизменяемым — можно кэшировать навсегда
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
